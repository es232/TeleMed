  <style>
    /* =====================================================
       GLOBAL RESET & THEME
    ==================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
      transition: all 0.3s ease-in-out;
    }

    body {
      background: #FED0BB;
      color: #461220;
      min-height: 100vh;
      overflow-x: hidden;
    }

    a { text-decoration: none; color: inherit; }
    button { cursor: pointer; outline: none; border: none; }

    /* =====================================================
       NAVBAR
    ==================================================== */
    .navbar {
      width: 100%;
      background: #461220;
      padding: 14px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .navbar .logo {
      font-size: 1.6rem;
      font-weight: 700;
      color: #FCB9B2;
      display: flex;
      align-items: center;
    }

    .navbar .logo i { margin-right: 10px; }

    .navbar ul {
      list-style: none;
      display: flex;
      gap: 28px;
    }

    .navbar ul li a {
      color: #FCB9B2;
      font-weight: 600;
      position: relative;
    }

    .navbar ul li a::after {
      content: "";
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0%;
      height: 2px;
      background: #B23A48;
    }

    .navbar ul li a:hover { color: #B23A48; }
    .navbar ul li a:hover::after { width: 100%; }

    .navbar .nav-right {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .navbar .btn-logout {
      background: #8C2F39;
      color: #FCB9B2;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 600;
    }

    .navbar .btn-logout:hover { background: #B23A48; color: #FED0BB; }

    /* =====================================================
       GREETING SECTION
    ==================================================== */
    .welcome {
      text-align: center;
      padding: 60px 20px 40px 20px;
      background: linear-gradient(160deg, #FCB9B2, #FED0BB);
      border-bottom: 6px solid #8C2F39;
    }

    .welcome h1 {
      font-size: 2.8rem;
      color: #8C2F39;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .welcome p {
      font-size: 1.2rem;
      color: #461220;
      line-height: 1.6;
      max-width: 850px;
      margin: 0 auto;
    }

    .welcome .lang-toggle {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .lang-toggle button {
      background: #8C2F39;
      color: #FCB9B2;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .lang-toggle button:hover { background: #B23A48; color: #FED0BB; }

    .voice-btn {
      margin-top: 15px;
      background: #B23A48;
      color: #FED0BB;
      border-radius: 50px;
      padding: 10px 20px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .voice-btn:hover { background: #8C2F39; }

    /* =====================================================
       INTERACTIVE VILLAGE MAP
    ==================================================== */
    .village-map-container {
      margin: 50px auto;
      text-align: center;
      position: relative;
      padding: 20px;
    }

    .village-map {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 40px;
      position: relative;
    }

    .map-item {
      width: 160px;
      height: 160px;
      background: #FCB9B2;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      cursor: pointer;
      position: relative;
    }

    .map-item:hover { transform: scale(1.08); background: #FED0BB; }

    .map-item i {
      font-size: 3rem;
      color: #461220;
      margin-bottom: 10px;
    }

    .map-item h4 { font-size: 1rem; color: #8C2F39; }
    .map-item span.status { font-size: 0.8rem; margin-top: 4px; font-weight: 600; color: #461220; }

    .map-item::after {
      content: attr(data-tip);
      position: absolute;
      bottom: -28px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.8rem;
      background: #461220;
      color: #FED0BB;
      padding: 4px 8px;
      border-radius: 5px;
      opacity: 0;
      pointer-events: none;
    }

    .map-item:hover::after { opacity: 1; }

    .village-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('https://i.ibb.co/2Y0Kz5V/village-bg.png');
      background-size: cover;
      background-position: center;
      opacity: 0.15;
      z-index: -1;
    }

    /* =====================================================
       PATIENT JOURNEY SECTION
    ==================================================== */
    .patient-journey {
      margin: 70px auto;
      padding: 40px 20px;
      max-width: 1000px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
    }

    .patient-journey h2 {
      font-size: 2rem;
      color: #8C2F39;
      margin-bottom: 20px;
    }

    .journey-steps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 30px;
      margin-top: 30px;
    }

    .step {
      background: #FCB9B2;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 6px 15px rgba(0,0,0,0.15);
    }

    .step i { font-size: 2.2rem; color: #461220; margin-bottom: 10px; }
    .step h3 { font-size: 1.1rem; margin-bottom: 8px; color: #8C2F39; }
    .step p { font-size: 0.9rem; color: #461220; }

    /* =====================================================
       SOS BUTTON
    ==================================================== */
    .sos-button {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #8C2F39;
      color: #FCB9B2;
      padding: 18px 24px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }

    .sos-button:hover { background: #B23A48; color: #FED0BB; }

    /* =====================================================
       FOOTER
    ==================================================== */
    footer {
      text-align: center;
      padding: 25px;
      background: #461220;
      color: #FCB9B2;
      margin-top: 40px;
      font-size: 0.9rem;
    }

    /* =====================================================
       RESPONSIVE
    ==================================================== */
    @media(max-width:768px){
      .navbar ul { display: none; }
      .village-map { flex-direction: column; }
      .map-item { width: 200px; height: 200px; }
      .sos-button { right: 15px; bottom: 15px; }
    }

    // Function to safely get nested values from the translations object
    function getTranslation(path, lang) {
      return path.split('.').reduce((obj, key) => obj && obj[key], translations[lang]);
    }

    function setLang(lang){
      localStorage.setItem("appLanguage", lang);

      // Translate all elements with data-i18n attribute
      document.querySelectorAll('[data-i18n]').forEach(element => {
        const key = element.getAttribute('data-i18n');
        const translatedText = getTranslation(key, lang);
        if (translatedText) {
          element.textContent = translatedText;
        }
      });

      // Special case for tooltips which use data-tip
      document.querySelectorAll('[data-i18n-tip]').forEach(element => {
        const key = element.getAttribute('data-i18n-tip');
        const translatedText = getTranslation(key, lang);
        if (translatedText) {
          element.setAttribute('data-tip', translatedText);
        }
      });
    }

    // Voice Narration
    function speakText(){
      const currentLang = localStorage.getItem("appLanguage") || "en";
      const welcomeTextElement = document.querySelector('[data-i18n="welcome.text"]');
      if (!welcomeTextElement) {
        console.error("Welcome text element not found.");
        return;
      }
      const text = welcomeTextElement.innerText;
      const speech = new SpeechSynthesisUtterance(text);
      
      // Set language for speech synthesis based on the current app language
      const langMap = {
        en: 'en-US', hi: 'hi-IN', pa: 'pa-IN', ta: 'ta-IN', mr: 'mr-IN'
      };
      speech.lang = langMap[currentLang] || 'en-US';

      speech.pitch = 1; 
      speech.rate = 1;
      window.speechSynthesis.speak(speech);
    }

    // Other functions from your original code
    function logout(){

    // Initialize on page load

      const savedLanguage = localStorage.getItem("appLanguage") || "en";
      setLang(savedLanguage);
    });
